# Render.com Blueprint — alternative to railway.toml.
# https://render.com/docs/blueprint-spec
#
# Backend FastAPI as a web service + frontend as a static site. Postgres
# can be attached as a Render managed DB OR pointed at Supabase free tier
# via DATABASE_URL env var (saves $7/mo).

services:
  - type: web
    name: samatu-api
    runtime: python
    region: frankfurt
    plan: starter
    buildCommand: pip install -r backend/requirements.txt
    # --proxy-headers + --forwarded-allow-ips='*' so request.client.host reflects
    # the REAL client IP behind Render's proxy (the per-IP login/register rate
    # limiter keyed on the proxy IP otherwise — one abuser DoSes everyone's auth;
    # 2026-06-19 security hunt). '*' is safe here: the service is only reachable
    # via Render's edge, never directly.
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENV
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false   # set manually in Render dashboard
      - key: SAMATU_SECRET_KEY
        sync: false
      - key: SAMATU_USER_DAILY_SPEND_EUR
        value: "0.50"
      - key: SAMATU_USER_HOURLY_EXTRACTS
        value: "10"
      - key: SAMATU_CORS_ORIGINS
        sync: false   # set to https://samatu.pathon.eu after DNS
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false

  - type: web
    name: samatu-web
    runtime: static
    region: frankfurt
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://samatu-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        value: https://samatu-api.onrender.com
