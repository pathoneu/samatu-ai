# Railway deployment config for Sąmatų AI backend.
# https://docs.railway.com/reference/config-as-code
#
# Build is driven by nixpacks.toml at repo root (paths reference backend/
# explicitly because Root Directory setting did not stick). startCommand
# below activates the venv that nixpacks installs into /opt/venv.

[deploy]
startCommand = ". /opt/venv/bin/activate && cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

# The `dev` environment (2026-09-16). Railway's config-as-code (this file) is
# deprecated and only read for LEGACY services — the production service — so the
# block below documents dev but does not drive it. What actually builds dev:
#   · service `api-dev` in environment `dev`, deployed with `railway up` from a
#     local checkout (GitHub source could not be attached from the CLI);
#   · variable RAILWAY_DOCKERFILE_PATH=backend/Dockerfile → the Dockerfile
#     builder (Railway no longer offers nixpacks to a new service; Railpack
#     cannot detect this repo); the image's CMD is the start command;
#   · STORAGE_BACKEND=local on its own /data volume, ENV=production, own
#     SAMATU_SECRET_KEY, a placeholder ANTHROPIC_API_KEY (no Vision on dev).
[environments.dev.build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"

[environments.dev.deploy]
startCommand = "cd /app/backend && uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'"
healthcheckPath = "/health"
healthcheckTimeout = 120
