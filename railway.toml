# Railway deployment config for Sąmatų AI backend.
# https://docs.railway.com/reference/config-as-code
#
# IMPORTANT: This file lives at repo root, but Railway is configured with
# `Root Directory = backend` in the service settings. So all build/start
# commands run with cwd = backend/. Nixpacks auto-detects Python from
# requirements.txt; we just need the start command.

[deploy]
startCommand = "uvicorn main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
