# Railway deployment config for Sąmatų AI backend.
# https://docs.railway.com/reference/config-as-code
#
# Build is driven by nixpacks.toml at repo root (paths reference backend/
# explicitly because Root Directory setting did not stick). startCommand
# below activates the venv that nixpacks installs into /opt/venv.

[build]
# Explicit: production was set to NIXPACKS in the dashboard; a service created
# from the CLI (the dev environment, 2026-09-16) defaults to Railpack, which
# ignores nixpacks.toml and fails to build this repo.
builder = "NIXPACKS"

[deploy]
startCommand = ". /opt/venv/bin/activate && cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
