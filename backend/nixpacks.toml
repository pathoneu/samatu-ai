# Explicit Nixpacks build plan for the FastAPI backend.
# Lives inside backend/ — Railway is configured with Root Directory=backend
# so this file is at the workspace root from Railway's perspective.
#
# Why explicit instead of auto-detect:
#   1. pdf2image needs poppler binaries (poppler_utils nix pkg).
#   2. opencv-python-headless needs libGL (libgl nix pkg).
#   3. Pinning Python 3.12 here is more reliable than runtime.txt.

providers = ["python"]

[phases.setup]
nixPkgs = [
  "python312",
  "python312Packages.pip",
  "poppler_utils",   # for pdf2image
]
aptPkgs = [
  "libgl1",          # opencv-python-headless runtime dep on Debian
  "libglib2.0-0",
]

[phases.install]
cmds = ["pip install --upgrade pip", "pip install -r requirements.txt"]

[start]
cmd = "uvicorn main:app --host 0.0.0.0 --port $PORT"
