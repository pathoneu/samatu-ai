# backend/requirements.lock — what production installs: the full pinned closure of
# requirements.txt (runtime only; test-only packages are in requirements-dev.lock).
# backend/Dockerfile and nixpacks.toml install exactly this file with --no-deps and
# then `pip check`, so a dependency missing here fails the build instead of being
# resolved to whatever is newest that day.
# Versions as tested on 2026-09-29 (3871 passed / 3 skipped); the runtime/test split
# on 2026-10-05 changed no version. Resolves to wheels only for CPython 3.12
# (production, nixpacks) and 3.14 (Dockerfile, dev venv) on manylinux x86_64.
# To change a version: docs/DEVELOPING.md › Dependencies. Never hand-edit one pin alone.
# Security bumps vs the old venv: pillow 12.3.0, pypdf 6.16.1, urllib3 2.7.0.
