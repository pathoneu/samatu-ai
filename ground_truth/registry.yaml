# Multi-project ground-truth registry.
#
# Each entry maps a project slug → its truth.json + the source PDFs.
# eval_harness.py + validate_truth_files.py read this to enumerate the
# contractor-validated benchmark set.
#
# Contractor notes: ALL six projects are from Rangovas A (Rangovas
# Rangovas A). This is a single-contractor cross-project benchmark.
# Cross-contractor calibration needs at least one non-Rangovas A truth
# file before the calibration_learner's promotion gate has industry-
# wide signal — until then, factors reflect Rangovas A scope
# conventions only.

schema_version: 1
projects:
  - slug: objektas_a
    name: "Objektas A"
    truth_path: ground_truth/objektas_a/truth.json
    project_pdf: docs/superpowers/fixtures/2026-05-26-objektas-a/project.pdf
    samata_pdf: docs/superpowers/fixtures/2026-05-26-objektas-a/samata-truth.pdf
    contractor: "Rangovas A"
    has_gt_dimensions: true
    has_cached_extract: true
    notes: "N=1 originator; only project with full gt_dimensions."

  - slug: objektas_b
    name: "Objektas B"
    truth_path: ground_truth/objektas_b/truth.json
    project_pdf: docs/superpowers/fixtures/2026-06-01-batch-5/Nr. 1/TP_Objektas B_2025naujausias.pdf
    samata_pdf: docs/superpowers/fixtures/2026-06-01-batch-5/Nr. 1/Pasiūlymas 20260413.pdf
    contractor: "Rangovas A"
    has_gt_dimensions: false
    has_cached_extract: false
    notes: "65-page TP; largest project in the batch."

  - slug: objektas_c
    name: "Objektas C"
    truth_path: ground_truth/objektas_c/truth.json
    project_pdf: "docs/superpowers/fixtures/2026-06-01-batch-5/Nr. 2/Techninio projekto planai_20250501 (a3)_2.pdf"
    samata_pdf: "docs/superpowers/fixtures/2026-06-01-batch-5/Nr. 2/Pasiūlymas apdailos darbams galutinis 2026.pdf"
    contractor: "Rangovas A"
    has_gt_dimensions: false
    has_cached_extract: false
