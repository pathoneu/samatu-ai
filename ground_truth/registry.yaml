# Multi-project ground-truth registry.
#
# Each entry maps a project slug → its truth.json + the source PDFs.
# eval_harness.py + validate_truth_files.py read this to enumerate the
# contractor-validated benchmark set.
#
# Contractor notes: ALL six projects are from Rangovas A (Rangovas
# Rangovas A). This is a single-contractor cross-project benchmark.
# Cross-contractor calibration needs at least one non-Rangovas A truth
# file before the calibration_learner's promotion gate has industry-
# wide signal — until then, factors reflect Rangovas A scope
# conventions only.

schema_version: 1
projects:
  - slug: berzas
    name: "Beržų g. 24"
    truth_path: ground_truth/berzas/truth.json
    project_pdf: docs/superpowers/fixtures/2026-05-26-berzu-g-24/project.pdf
    samata_pdf: docs/superpowers/fixtures/2026-05-26-berzu-g-24/samata-truth.pdf
    contractor: "Rangovas A"
    has_gt_dimensions: true
    has_cached_extract: true
    notes: "N=1 originator; only project with full gt_dimensions."

  - slug: objektas_b
