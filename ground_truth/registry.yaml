  - slug: romainiai
    name: "Objektas E"
    truth_path: ground_truth/romainiai/truth.json
    project_pdf: "docs/superpowers/fixtures/2026-06-01-batch-5/Nr. 3/Objektas C INTERJERAS 4.1-5.1 punktas.pdf"
    samata_pdf: "docs/superpowers/fixtures/2026-06-01-batch-5/Nr. 3/Pasiūlymas apdailos darbams atnaujintas.pdf"
    contractor: "Rangovas A"
    has_gt_dimensions: false
    has_cached_extract: false
    scope_mismatch: true
    scope_mismatch_reason: |
      REWRITTEN 2026-07-29 — the previous wording was factually wrong on both counts
      and is preserved here for traceability:
        "Contractor's pasiūlymas prices the 4.1-5.1 punktas subset of the project; the
         project_pdf is the full 45-page interior design. AI extracts the whole document,
         truth covers a subset → totals not directly comparable (AI 978.55 m² combined
         paint vs truth 250.95 m² = +290%). Exclude from systematic error analysis."
      (a) The project_pdf is not a superset: it is itself titled "4.1-5.1 punktas" and
          IS the 45-page document. Both sides carry the same punktas label.
      (b) The +290% arithmetic compared against 250.95 = truth key
          dazymo_walls_plus_ceilings_combined_subset_m2 (contractor item 3 alone),
          which the eval does not score. The scored key is
          dazymo_walls_plus_ceilings_combined_m2 = 420.08.

      The real, verified reason to exclude:
      1. The samata is a QUOTE, not a takeoff. Its own footer states the quantities are
         preliminary and will be re-measured from the work actually performed
         ("Darbų kiekiai pasiūlyme yra preliminarūs ir bus tikslinami po darbų, pagal
         atliktų darbų faktą"). It is not a measured measuring stick.
      2. It is a ONE-SECTION document — "Skyrius Sienų lubų glaistymas dažymas",
         15 lines, putty + paint only. It prices no tiling, no flooring, no baseboards,
         no GKP walls. The app extracts the whole 2-storey, 20-room, 267.71 m² house
         including 262 m² of wall tile. The two sides do not cover the same surfaces,
         so a paint-area diff cannot separate scope from extraction error.
      3. Cross-check: contractor paint (items 2+3+5) = 420.08 m² of walls+ceilings for
         267.71 m² of floor = 1.57× floor. CLAUDE.md validation #1 puts paintable WALL
         area alone at 2.5-4× floor. The contractor's total is below the floor of the
         walls-only band, i.e. it demonstrably does not cover whole-house painting.
      Consequence: excluded from the corpus MAE (run_totals_only_multi already skips it;
      since 2026-07-29 --rescore also prints an exclusion banner). Its per-project
      headline MAE must never be averaged with the other projects.
    notes: "Interior-only scope (no plytelės). Contractor samata is a single-section preliminary quote; see scope_mismatch_reason."

  - slug: sernu
    name: "Objektas F"
    truth_path: ground_truth/sernu/truth.json
    project_pdf: "docs/superpowers/fixtures/2026-06-01-batch-5/Nr. 4/I109_objektas_f_plyteles_2025 04 02.pdf"
    samata_pdf: "docs/superpowers/fixtures/2026-06-01-batch-5/Nr. 4/Sąmata.pdf"
    contractor: "Rangovas A"
    has_gt_dimensions: false
    has_cached_extract: false
    blocked_for_vision_extraction: true
    blocked_reason: "No architectural floor plan in bundle — only specialty (elektra, plytelės) drawings. Ask user for missing architectural PDF before any Vision spend."

  - slug: objektas_d
    name: "Objektas D (Butas)"
    truth_path: ground_truth/objektas_d/truth.json
    project_pdf: "docs/superpowers/fixtures/2026-06-01-batch-5/Nr. 5/objektas_d_TP_bundled.pdf"
    samata_pdf: "docs/superpowers/fixtures/2026-06-01-batch-5/Nr. 5/Galutinė sąmata.pdf"
    contractor: "Rangovas A"
    has_gt_dimensions: false
    has_cached_extract: false
    notes: "APARTMENT (butas), smallest scope. 2026-06-06: bundled 4 of the split single-page Layout4 sheets (Apmatavimai dimensions + Naujai montuojamu pertvaru floor plan + Pakabinamu lubu ceiling + Sviestuvu lighting) into objektas_d_TP_bundled.pdf and re-entered MAE scoring (was blocked_partial_input)."

  # ── SECOND BATCH (2026-09-05) — OUT-OF-SAMPLE. Same contractor, two NEW
  # architects/designers. Rule: never tune a rule, prompt, concept mapping or
  # calibration factor while looking at these; measure first, diagnose second,
  # fix on the in-sample corpus, re-measure here. `out_of_sample: true` keeps
  # them out of the in-sample corpus mean (reported in their own block).
  - slug: objektas_g
    name: "Objektas G (Butas, naujas namas)"
    truth_path: ground_truth/objektas_g/truth.json
    project_pdf: docs/superpowers/fixtures/2026-09-05-batch-2/objektas_g/project.pdf
    samata_pdf: docs/superpowers/fixtures/2026-09-05-batch-2/objektas_g/samata-aktas.pdf
    contractor: "Rangovas A"
    has_gt_dimensions: false
    has_cached_extract: true
    samata_parsed_by_hand: true
    out_of_sample: true
    blind_result: "Blind 2026-09-05 (runner est. $12.91, 25 min): headline MAE 49.98 %, 2.5 % of his € within ±10 %; 9 rooms read (one phantom bathroom); paint +71 % (ceilings out of scope + tiled walls also painted), corners +122 %; 12/20 rows unmapped by wording (tiles by format)."
    notes: "16-page interior of a flat in a new-build, vector PDF with text layer. NO eksplikacija table (dimensions on the pertvarų planas; apdailos legend gives 220 m² of painted walls). Truth is an atliktų darbų aktas: bathroom prep + tiles + WALL paint only — ceilings, floors and wooden skirting are outside his scope here. Parsed by hand from the act (parse_all_samatas.py does not read its group-column layout)."

  - slug: objektas_h
    name: "Objektas H (Namas)"
    truth_path: ground_truth/objektas_h/truth.json
    project_pdf: docs/superpowers/fixtures/2026-09-05-batch-2/objektas_h/project.pdf
    samata_xlsx: docs/superpowers/fixtures/2026-09-05-batch-2/objektas_h/samata.xlsx
    contractor: "Rangovas A"
    has_gt_dimensions: false
    has_cached_extract: true
    samata_parsed_by_hand: true
    out_of_sample: true
    blind_result: "Blind 2026-09-05 (runner est. $8.10, 12 min): headline MAE 14.19 %, 31.8 % of his € within ±10 %; 11/11 rooms exact from the table; GKP ceilings −1 %, corners +6 %; paint +24 % (tiled bathroom walls also painted, default window sizes, 2.82 m default height); Rotband −34 %."
    notes: "8 A4 pages by a designer studio: išdėstymo planas WITH eksplikacija (11 rooms, 143,27 m²), rozečių, apšvietimo, vandens, lubų, sienų dažymo (designer: 320 m²), grindų dangų, pertvarų planai; no išklotinės, no door/window schedule. Truth is an xlsx pasiūlymas (GKP, glaistymas/dažymas, santechnika quantified; tiles + site costs priced without quantities) — parsed by hand (xlsx, not PDF)."

  # ── Objektas A ABLATIONS (2026-08-22) — synthetic "foreign projects" with KNOWN truth.
  # We have no out-of-sample interior PDF, so these manufacture the ways a
  # foreign project differs from Objektas A while keeping its contractor-verified
  # truth. Built by scripts/build_objektas_a_ablations.py; PDFs untracked like all
  # fixtures. `ablation_of` EXCLUDES them from the corpus average (they would
  # quadruple Objektas A's weight) — score each one individually:
  #   venv/bin/python eval_harness.py --project objektas_a_bundle --vision
  - slug: objektas_a_bundle
    name: "Objektas A — buried in a 54-page bundle (SA-02 + interior)"
    truth_path: ground_truth/objektas_a/truth.json
    project_pdf: "docs/superpowers/fixtures/2026-08-22-objektas-a-ablations/objektas_a_bundle.pdf"
    contractor: "Rangovas A"
    ablation_of: objektas_a
    has_gt_dimensions: true
    has_cached_extract: false
    notes: "37 pages of the SA-02 architectural part FIRST, then the 17 interior pages — the shape a contractor actually uploads. Tests page selection, the 20-page soft cap and runtime."
  - slug: objektas_a_no_eksplikacija
    name: "Objektas A — no eksplikacija table"
    truth_path: ground_truth/objektas_a/truth.json
    project_pdf: "docs/superpowers/fixtures/2026-08-22-objektas-a-ablations/objektas_a_no_eksplikacija.pdf"
    contractor: "Rangovas A"
    ablation_of: objektas_a
    has_gt_dimensions: true
    has_cached_extract: false
    notes: "p2 rasterised with the PATALPŲ EKSPLIKACIJA table whited out of the image AND the text layer (all other p2 words kept as an invisible layer). Forces the no-table path (the Objektas C failure mode) on a project we can score."
  - slug: objektas_a_no_isklotines
    name: "Objektas A — no wall elevations"
    truth_path: ground_truth/objektas_a/truth.json
    project_pdf: "docs/superpowers/fixtures/2026-08-22-objektas-a-ablations/objektas_a_no_isklotines.pdf"
    contractor: "Rangovas A"
    ablation_of: objektas_a
    has_gt_dimensions: true
    has_cached_extract: false
    notes: "Pages 11–16 (išklotinės) removed → 11 pages. Tile must fall back to the apdailos plan / paskirtis defaults; rows should go geltona/raudona, not confidently wrong."
  - slug: objektas_a_flat150
    name: "Objektas A — flattened 150 DPI raster, no text layer"
    truth_path: ground_truth/objektas_a/truth.json
    project_pdf: "docs/superpowers/fixtures/2026-08-22-objektas-a-ablations/objektas_a_flat150.pdf"
    contractor: "Rangovas A"
    ablation_of: objektas_a
    has_gt_dimensions: true
    has_cached_extract: false
    notes: "Every page rasterised at 150 DPI — a scanned / iLovePDF-style re-export. Every deterministic text lane goes dark; Vision carries everything."
