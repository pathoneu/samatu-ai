# eval_harness.py + validate_truth_files.py read this to enumerate the
# contractor-validated benchmark set.
#
# Contractor notes: ALL six projects are from Rangovas A (rangovas
# Rangovas A). This is a single-contractor cross-project benchmark.
# Cross-contractor calibration needs at least one non-Rangovas A truth
# file before the calibration_learner's promotion gate has industry-
# wide signal — until then, factors reflect Rangovas A scope
# conventions only.

