# Page-level expected labels for A LAIDA project (stogai V1 bake-off).
# Source PDF: backend/tests/fixtures/stogai/a_laida.pdf (symlink)
#
# Confidence per label:
#   HIGH = text title clearly extractable via pdfplumber (e.g. "STOGO PLANAS")
#   MED  = inferred from page text + position in document
#   LOW  = guessed (cover pages, details without titles)
#
# Pages where confidence is LOW are EXCLUDED from accuracy scoring —
# they're listed for completeness but flagged `skip_in_eval: true`.

project: a_laida
source_pdf: backend/tests/fixtures/stogai/a_laida.pdf
expected_dalis: SA           # whole project is SA dalis per a_laida_roof.yaml
expected_roof_type: keturslaitis

pages:
