# Nixpacks build plan for Sąmatų AI backend.
# Lives at repo root because Railway's Root Directory setting did not stick.
# Paths reference backend/ explicitly. Builds inside a venv to keep deps
# isolated; activates it for both install + start.
#
# pdf2image needs poppler binaries; opencv-python-headless needs libGL +
# libglib2 at runtime; both declared below.

providers = ["python"]

[phases.setup]
nixPkgs = [
  "python312",
  "python312Packages.pip",
  "poppler_utils",
]
aptPkgs = [
  "libgl1",
  "libglib2.0-0",
]

[phases.install]
# The LOCK, not requirements.txt (2026-10-05): exactly the versions the suite
# passed on, runtime only, resolved to wheels on CPython 3.12. --no-deps + `pip
# check`: a dependency missing from the lock fails the build instead of being
# resolved to whatever is newest on deploy day. (docs/DEVELOPING.md › Dependencies)
cmds = [
  "python3 -m venv /opt/venv",
  ". /opt/venv/bin/activate && pip install --upgrade pip",
  ". /opt/venv/bin/activate && pip install --no-deps -r backend/requirements.lock && pip check",
]

[start]
# --proxy-headers/--forwarded-allow-ips: real client IP behind the platform proxy
# so the per-IP auth rate limiter works (2026-06-19 security hunt).
cmd = ". /opt/venv/bin/activate && cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'"
